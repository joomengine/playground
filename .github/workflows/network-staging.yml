name: Deploy and verify network staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-staging
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy and verify staging
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: network-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NETWORK_CLOUDFLARE_PLAN: ${{ vars.NETWORK_CLOUDFLARE_PLAN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: services/network-worker
      - name: Require reviewed staging configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/network-deployment-check.mjs staging
      - name: Deploy staging Worker
        working-directory: services/network-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env staging
      - name: Verify public staging endpoint
        env:
          NETWORK_ENDPOINT: ${{ steps.config.outputs.endpoint }}
        run: node scripts/network-health.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify hosted candidate
        env:
          NETWORK_ENDPOINT: ${{ steps.config.outputs.endpoint }}
          NETWORK_PLAYGROUND_URL: ${{ vars.NETWORK_PLAYGROUND_URL }}
          NETWORK_TEST_TARGET: ${{ vars.NETWORK_TEST_TARGET }}
          NETWORK_EXPECTED_SHA256: ${{ vars.NETWORK_EXPECTED_SHA256 }}
        run: node --test test/network-hosted.browser.mjs
      - name: Retain hosted staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: network-hosted-staging
          path: test-results/network-hosted.json
          if-no-files-found: error
          retention-days: 30
