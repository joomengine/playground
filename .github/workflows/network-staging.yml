name: Deploy network staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy staging Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: network-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: services/network-worker/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: services/network-worker
      - run: npm test
        working-directory: services/network-worker
      - name: Deploy Worker
        working-directory: services/network-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env staging
