name: Deploy network production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful hosted staging workflow run for this exact commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: network-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy verified production Worker
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: network-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NETWORK_CLOUDFLARE_PLAN: ${{ vars.NETWORK_CLOUDFLARE_PLAN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: services/network-worker/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: services/network-worker
      - name: Require same-commit hosted staging acceptance
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NETWORK_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/network-deployment-check.mjs production
      - name: Deploy production Worker
        working-directory: services/network-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env production
      - name: Verify production health and rejection policy
        env:
          NETWORK_ENDPOINT: ${{ steps.config.outputs.endpoint }}
        run: node scripts/network-health.mjs
