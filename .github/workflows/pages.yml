name: Publish playground to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playground-static
          path: dist
      - name: Check the configured network endpoint before publication
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('dist/assets/manifest.json', 'utf8'));
          assert.equal(manifest.deployment.environment, 'production', 'Staging builds must never publish to production Pages.');
          const config = JSON.parse(await readFile('dist/config/network.json', 'utf8'));
          if (config.enabled) {
            const endpoint = new URL(config.endpoint);
            assert.equal(endpoint.protocol, 'https:');
            const response = await fetch(new URL('healthz', `${config.endpoint.replace(/\/+$/, '')}/`), {
              redirect: 'error', signal: AbortSignal.timeout(20000),
            });
            assert.equal(response.status, 200);
            const health = await response.json();
            assert.equal(health.version, config.protocolVersion);
            assert.equal(health.enabled, true);
            assert.equal(health.mode, 'controlled-origins');
          }
          JS
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - name: Publish tested distribution
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Smoke test the published production deployment
        timeout-minutes: 4
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/pages-smoke.mjs dist
