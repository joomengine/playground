name: Validate playground

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fast source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      full: ${{ steps.plan.outputs.full }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      php: ${{ steps.plan.outputs.php }}
      joomla: ${{ steps.plan.outputs.joomla }}
      bridge: ${{ steps.plan.outputs.bridge }}
      emsdk: ${{ steps.plan.outputs.emsdk }}
      emscripten: ${{ steps.plan.outputs.emscripten }}
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate source and focused integration helpers
        run: |
          npm run check
          npm test
      - name: Select validation from changed behavior
        id: plan
        env:
          CI_FULL: ${{ github.event_name != 'pull_request' }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-plan.mjs

  build:
    name: Build and validate native runtime
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: joomengine/mariadb-wasm-bridge
          ref: ${{ needs.checks.outputs.bridge }}
          path: external/bridge
      - name: Restore source-matched native extensions
        id: native
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/native
            .cache/fileinfo
            .cache/curl
            .cache/sodium
            .cache/phpdbg
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.checks.outputs.native }}-${{ hashFiles('scripts/build-fileinfo.mjs', 'scripts/build-curl.mjs', 'scripts/build-sodium.mjs', 'scripts/fileinfo.mjs', 'scripts/curl.mjs', 'scripts/sodium.mjs', 'scripts/phpdbg-build.mjs', 'scripts/phpdbg.mjs', 'native/**') }}
      - name: Restore verified download archives
        id: archives
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/*.zip
            .cache/*.tar.gz
            .cache/packages
            .cache/jcb-dependency-archives
            .cache/language-sources
            .cache/language-packages
            .cache/tools
          key: archives-${{ runner.os }}-${{ hashFiles('versions.json', 'deploys/*.json', 'dependencies/**/*.json', 'scripts/language-packages.mjs') }}
          restore-keys: archives-${{ runner.os }}-
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison re2c libtool pkg-config php8.3-cli php8.3-mbstring php8.3-xml php8.3-gd php8.3-zip php8.3-curl
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.native.outputs.cache-hit != 'true'
        with:
          repository: emscripten-core/emsdk
          ref: ${{ needs.checks.outputs.emsdk }}
          path: external/emsdk
      - name: Restore pinned compiler tools
        id: compiler
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            external/emsdk/upstream
            external/emsdk/node
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ needs.checks.outputs.emsdk }}-${{ needs.checks.outputs.emscripten }}
      - name: Configure pinned Emscripten compiler
        if: steps.native.outputs.cache-hit != 'true'
        env:
          EMSCRIPTEN_VERSION: ${{ needs.checks.outputs.emscripten }}
        run: |
          external/emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          external/emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
      - name: Compile version-matched native extensions
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          source external/emsdk/emsdk_env.sh
          while IFS= read -r minor; do
            bash external/bridge/native/build-upstream.sh "$minor" "$PWD/.cache/native"
            BRIDGE_SOURCE_DIR=external/bridge node scripts/build-fileinfo.mjs "$minor"
            BRIDGE_SOURCE_DIR=external/bridge node scripts/build-curl.mjs "$minor"
            BRIDGE_SOURCE_DIR=external/bridge node scripts/build-sodium.mjs "$minor"
            BRIDGE_SOURCE_DIR=external/bridge node scripts/phpdbg-build.mjs "$minor"
          done < <(node --input-type=module -e "import p from './versions.json' with {type:'json'}; for (const v of p.php) console.log(v.version)")
      - name: Cache pinned compiler after successful compilation
        if: steps.native.outputs.cache-hit != 'true' && steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            external/emsdk/upstream
            external/emsdk/node
          key: ${{ steps.compiler.outputs.cache-primary-key }}
      - name: Prepare real MariaDB engine for native validation
        run: |
          npm ci --prefix external/bridge --ignore-scripts
          node scripts/prepare-bridge-engine.mjs external/bridge
          npm run prepare:engine --prefix external/bridge
      - name: Validate upstream PHP and native MariaDB PDO
        if: needs.checks.outputs.full == 'true' || steps.native.outputs.cache-hit != 'true'
        run: |
          PHP_WASM_MODULE_ROOT="$PWD/node_modules" \
          PHP_WASM_EXTENSION_DIR="$PWD/.cache/native" \
          node --test external/bridge/native/tests/upstream.test.mjs
      - name: Cache source-matched compiled extensions
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/native
            .cache/fileinfo
            .cache/curl
            .cache/sodium
            .cache/phpdbg
          key: ${{ steps.native.outputs.cache-primary-key }}
      - name: Build verified static distribution
        env:
          MARIADB_DRIVER_DIR: .cache/native
          PHP_BINARY: php8.3
        run: npm run build
      - name: Cache verified download archives
        if: steps.archives.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/*.zip
            .cache/*.tar.gz
            .cache/packages
            .cache/jcb-dependency-archives
            .cache/language-sources
            .cache/language-packages
            .cache/tools
          key: ${{ steps.archives.outputs.cache-primary-key }}
      - name: Validate provisioning and runtime capabilities
        if: needs.checks.outputs.full == 'true' || steps.native.outputs.cache-hit != 'true'
        env:
          PLAYGROUND_LARGE_UPLOAD: '1'
        run: npm run test:provisioning
      - name: Build independently verified demonstration snapshots
        run: npm run build:deploys
      - name: Retain candidate static distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playground-static
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  interaction:
    name: Editor and interaction checks (${{ matrix.browser }})
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install selected browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Validate Code, isolated AI, layout and language interactions
        env:
          PLAYGROUND_BROWSERS: ${{ matrix.browser }}
        run: |
          result=0
          for suite in test/code-workbench.browser.mjs test/code-ai-browser.mjs test/code-host-lifecycle.browser.mjs test/language-selector.browser.mjs test/extension-inputs.browser.mjs test/dynamic-selection.browser.mjs; do
            node --test "$suite" || result=1
          done
          exit "$result"
      - name: Retain interaction receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playground-interaction-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Browser validation (${{ matrix.browser }}, ${{ matrix.suite }})
    needs: [checks, build]
    runs-on: ubuntu-24.04
    # Independent jobs keep a UI failure from suppressing runtime or visual evidence.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        suite: [code, ui, rocket, runtime]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playground-static
          path: dist
      - name: Install selected browser engine
        id: browser_install
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Validate Code against the running Joomla runtime
        if: matrix.suite == 'code'
        env:
          PLAYGROUND_BROWSERS: ${{ matrix.browser }}
          PLAYGROUND_PHP_VERSIONS: ${{ needs.checks.outputs.php }}
        run: |
          result=0
          for suite in test/code-joomla.browser.mjs test/code-debug-joomla.browser.mjs; do
            node --test "$suite" || result=1
          done
          exit "$result"
      - name: Select independent runtime scenarios
        id: scenarios
        if: matrix.suite != 'code'
        env:
          SELECTED_SCENARIOS: ${{ needs.checks.outputs.scenarios }}
          VALIDATION_SUITE: ${{ matrix.suite }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const all = ['matrix', 'memory', 'timeout', 'static', 'ui', 'deploys', 'export', 'rocket'];
          const selected = process.env.SELECTED_SCENARIOS?.split(',').filter(Boolean);
          const suite = process.env.VALIDATION_SUITE;
          const scenarios = (selected?.length ? selected : all).filter(name => suite === 'runtime'
            ? !['ui', 'rocket'].includes(name) : name === suite);
          appendFileSync(process.env.GITHUB_OUTPUT, `scenarios=${scenarios.join(',')}\n`);
          JS
      - name: Validate the exact candidate build
        if: ${{ !cancelled() && steps.browser_install.outcome == 'success' && steps.scenarios.outputs.scenarios != '' }}
        env:
          PLAYGROUND_BROWSERS: ${{ matrix.browser }}
          PLAYGROUND_SCENARIOS: ${{ steps.scenarios.outputs.scenarios }}
          PLAYGROUND_PHP_VERSIONS: ${{ needs.checks.outputs.php }}
          PLAYGROUND_JOOMLA_VERSIONS: ${{ needs.checks.outputs.joomla }}
        run: npm run test:browser
      - name: Retain browser receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playground-test-results-${{ matrix.browser }}-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    name: Isolation and approved images (${{ matrix.browser }})
    needs: [checks, build]
    if: needs.checks.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playground-static
          path: dist
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify isolation and original image bytes through real PHP
        env:
          PLAYGROUND_ISOLATION_BROWSER: ${{ matrix.browser }}
          PUBLIC_ASSET_BROWSER: ${{ matrix.browser }}
          PUBLIC_ASSET_RUNTIME_DIST: dist
          PUBLIC_ASSET_BROWSER_EVIDENCE: test-results/public-assets-${{ matrix.browser }}.json
        run: |
          mkdir -p test-results
          node --test test/isolation.browser.mjs
          node --test test/public-assets.browser.mjs
      - name: Verify Adminer persistence and tool lifecycle
        if: matrix.browser == 'chromium'
        run: node --test test/adminer.browser.mjs
      - name: Retain compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playground-compatibility-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  version-catalog:
    name: Version catalog installation (${{ matrix.browser }})
    needs: [checks, build]
    if: needs.checks.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playground-static
          path: dist
      - name: Install selected browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install the published version choices from the candidate build
        env:
          PLAYGROUND_BROWSERS: ${{ matrix.browser }}
        run: node --test test/version-catalog.browser.mjs
      - name: Retain version catalog receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playground-version-catalog-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  validate:
    name: Validate playground
    needs: [checks, build, browser, interaction, compatibility, version-catalog]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all selected checks
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILD_REQUIRED: ${{ needs.checks.outputs.build }}
          BUILD: ${{ needs.build.result }}
          BROWSERS: ${{ needs.browser.result }}
          INTERACTIONS: ${{ needs.interaction.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          VERSION_CATALOG: ${{ needs.version-catalog.result }}
        run: |
          test "$CHECKS" = success
          if [ "$BUILD_REQUIRED" = true ]; then
            test "$BUILD" = success
            test "$BROWSERS" = success
            test "$INTERACTIONS" = success
            test "$COMPATIBILITY" = success
            test "$VERSION_CATALOG" = success
          fi
