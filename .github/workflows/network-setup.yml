name: Set up Cloudflare proxy

on:
  workflow_dispatch:

permissions:
  contents: read

# Provisioning and production releases must not race over the same Worker.
concurrency:
  group: network-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  setup:
    name: Provision production proxy
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: network-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: services/network-worker/package-lock.json
      - name: Install locked deployment tooling
        run: npm ci --ignore-scripts
        working-directory: services/network-worker
      - name: Create or update the disabled production proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/network-setup.mjs
      - name: Retain public setup settings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-proxy-public-settings
          path: test-results/network-setup/
          if-no-files-found: error
          retention-days: 30
