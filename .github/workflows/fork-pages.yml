name: Publish fork playground

on:
  push:
    paths: ['site/**', '.github/workflows/fork-pages.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/fork-pages.yml']
  schedule:
    - cron: '47 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose:
    if: >-
      github.repository != 'joomengine/playground' &&
      (github.event_name == 'workflow_dispatch' || vars.PLAYGROUND_FORK_PAGES == 'true') &&
      (github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.select.outputs.build }}
      engine_sha: ${{ steps.select.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: fork
          persist-credentials: false
      - name: Read the fork's published Pages address
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
          echo "url=$pages_url" >> "$GITHUB_OUTPUT"
      - name: Select the official published engine and check the fork's current deployment
        id: select
        env:
          PLAYGROUND_SITE_DIR: ${{ github.workspace }}/fork/site
          PAGES_URL: ${{ steps.pages.outputs.url }}
        run: node fork/scripts/fork-engine.mjs select
      - name: Check out the build tools matching those exact published bytes
        if: steps.select.outputs.build == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: joomengine/playground
          ref: ${{ steps.select.outputs.sha }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.select.outputs.build == 'true'
        with:
          node-version-file: engine/.node-version
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Compose, prepare and verify the fork's site
        if: steps.select.outputs.build == 'true'
        working-directory: engine
        env:
          ENGINE_BUILD_ID: ${{ steps.select.outputs.id }}
          ENGINE_SHA: ${{ steps.select.outputs.sha }}
          ENGINE_RUN_ID: ${{ steps.select.outputs.run_id }}
          PLAYGROUND_SITE_DIR: ${{ github.workspace }}/fork/site
          PAGES_URL: ${{ steps.select.outputs.url }}
        run: |
          npm ci --ignore-scripts
          node scripts/build-public-artifact.mjs compose
          node scripts/build-public-artifact.mjs snapshots --reuse-prepared
          node scripts/build-public-artifact.mjs verify
          npx --no-install playwright install --with-deps --only-shell chromium
          node --test test/fork-site.browser.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.select.outputs.build == 'true' && github.event_name != 'pull_request'
        with:
          path: engine/dist

  deploy:
    needs: compose
    if: needs.compose.outputs.changed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: joomengine/playground
          ref: ${{ needs.compose.outputs.engine_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: pages-upload
      - name: Recover the expected publication files for smoke checks
        run: |
          mkdir dist
          tar -xf pages-upload/artifact.tar -C dist
      - id: publication
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the fork's published site
        timeout-minutes: 4
        env:
          PAGES_URL: ${{ steps.publication.outputs.page_url }}
        run: node scripts/pages-smoke.mjs dist
