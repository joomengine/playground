name: Install Playwright browser
description: Install the locked browser and verify that it renders on this runner.
inputs:
  browser:
    description: Browser engine (chromium, firefox, or webkit).
    required: true
runs:
  using: composite
  steps:
    - name: Install and launch selected browser
      shell: bash
      env:
        PLAYGROUND_BROWSER: ${{ inputs.browser }}
      run: |
        case "$PLAYGROUND_BROWSER" in
          chromium|firefox|webkit) ;;
          *) echo '::error::browser must be chromium, firefox, or webkit.' >&2; exit 1 ;;
        esac
        ./node_modules/.bin/playwright install "$PLAYGROUND_BROWSER"
        render_page() {
          node --input-type=module <<'JS'
        import * as playwright from 'playwright';
        const browser = await playwright[process.env.PLAYGROUND_BROWSER].launch({ timeout: 15000 });
        try {
          const page = await browser.newPage();
          await page.setContent('<p>Playground</p>');
          await page.screenshot({ timeout: 10000 });
        } finally {
          await browser.close();
        }
        JS
        }
        # Hosted runners often already have the libraries needed by our headless tests.
        if render_page; then exit 0; fi
        echo '::warning::Browser render failed. Installing system dependencies and trying again.'
        # Preserve the Ubuntu runner's configured, signed package sources and mirror failover.
        ./node_modules/.bin/playwright install-deps "$PLAYGROUND_BROWSER"
        render_page
