<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>JoomEngine Rocket</title>
  <link rel="icon" type="image/svg+xml" href="src/brand/rocket.svg">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09072c;color:#fff;font-family:system-ui,sans-serif}
    #site{display:block;width:100%;height:100dvh;border:0;background:white}
    #site[hidden]{display:none}#launch{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:1.5rem;gap:1rem}
    #launch[hidden]{display:none}#launch img{width:3rem;margin:auto}#message{max-width:38rem;white-space:pre-wrap}a{color:#ffd36d}
  </style>
</head>
<body>
  <div id="launch" role="status"><img src="src/brand/rocket.svg" alt=""><p id="message">Opening your Joomla site…</p><a href="./">Return to Rocket</a></div>
  <div id="site-mount"></div>
  <script type="module" src="src/standalone.mjs"></script>
</body>
</html>
